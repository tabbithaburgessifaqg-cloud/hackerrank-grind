            echo "stage=validate-production-integration-tests path=/tmp/store-C/cfg.bin.sw b=$(wc -c </tmp/store-C/cfg.bin.sw)"
      - persist_to_workspace:
          root: /tmp/store-C
          paths:
            - 'cfg.bin.sw'
  validate-production-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/store-C
      - run:
          name: Pick up config
          command: |
            comm -23 <(sort /tmp/store-C/cfg.bin.sw 2>/dev/null) <(sort -u /tmp/store-C/cfg.bin.sw 2>/dev/null) 2>/dev/null | wc -l || true
      - run:
          name: Get sources
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar xJf ci-output.tar.xz
      - run:
          name: Index artifacts
          command: sleep 25s
      - run:
          command: ./deploy-rc3 && true
